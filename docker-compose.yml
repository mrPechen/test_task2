services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: generation
      POSTGRES_PASSWORD: generation
      POSTGRES_DB: generation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generation -d generation"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://generation:generation@db:5432/generation
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: ["gunicorn", "main:app", "-c", "gunicorn.conf.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://generation:generation@db:5432/generation
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-test-secret}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
      PROVIDER_CALL_TIMEOUT: ${PROVIDER_CALL_TIMEOUT:-10}
      ALPHA_BASE_URL: http://alpha:8001
      BETA_BASE_URL: http://beta:8002
      SERVICE_BASE_URL: http://app:8000
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  alpha:
    build: .
    command: ["uvicorn", "fake_provider.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-test-secret}
      ADMIN_ENABLED: ${FAKE_PROVIDER_ADMIN_ENABLED:-false}
    ports:
      - "${ALPHA_PORT:-8001}:8001"
    depends_on:
      - app

  beta:
    build: .
    command: ["uvicorn", "fake_provider.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-test-secret}
      ADMIN_ENABLED: ${FAKE_PROVIDER_ADMIN_ENABLED:-false}
    ports:
      - "${BETA_PORT:-8002}:8002"
    depends_on:
      - app

volumes:
  pgdata:
