[project]
name = "generation-service"
version = "0.1.0"
description = "Сервис генерации: заказ, списание токенов, маршрутизация по провайдерам"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "gunicorn>=23.0.0,<24.0.0",
    "sqlalchemy[asyncio]>=2.0.40,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.10.0,<2.11.0",
    "httpx>=0.28.0,<0.29.0",
    "alembic>=1.14.0,<1.15.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: интеграционные тесты против живого compose-стека",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
